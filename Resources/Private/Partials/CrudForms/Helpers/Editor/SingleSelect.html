{namespace crud=Sandstorm\CrudForms\ViewHelpers}

<f:if condition="{field.repository}">
    <f:then>
        <f:form.select
            options="{crud:internal.findObjectsForListing(repository: field.repository)}"
            optionLabelField="label" property="{field.property}"
            id="{field.property}"
            class="{formFieldClass}"
            optionValueField="value"
            optionLabelField="label"
            prependOptionLabel="{f:if(condition: field.required, else: '-- Select --')}"
            prependOptionValue=""
        />
    </f:then>
    <f:else>
        <f:form.select
            options="{field.options}"
            property="{field.property}"
            class="{formFieldClass}"
            id="{field.property}"
            optionValueField="value"
            optionLabelField="label"
            prependOptionLabel="{f:if(condition: field.required, else: '-- Select --')}"
            prependOptionValue=""
        />
    </f:else>
</f:if>
